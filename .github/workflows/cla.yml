# Asks every contributor to sign CLA.md once, on their first pull request, and
# records signatures in signatures/cla.json on the `cla-signatures` branch.
# See COMMERCIAL-LICENSE.md for why the project needs a CLA.
#
# pull_request_target runs with write access, which is safe here only because
# this workflow never checks out or runs the pull request's code.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CLA.md
          # must not be a protected branch
          branch: cla-signatures
          allowlist: Dinesh210805,*[bot]
