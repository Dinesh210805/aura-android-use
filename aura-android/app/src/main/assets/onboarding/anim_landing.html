<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AURA — Loading Sequence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap');

  :root{
    --cream:#FCF4E6;
    --paper:#FFFDF8;
    --blood:#A31621; /* Wine / Deep Blood Red */
    --ink-dark:#0D0B0A; /* Darker, crisp contrast */
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    height:100%;
    width:100%;
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:'Manrope','Outfit',sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    user-select:none;
  }

  .stage{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---- Flash effect on start ---- */
  .flash{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:6;
    background:radial-gradient(circle at 50% 44%, rgba(255,255,255,.9), transparent 60%);
    opacity:0;
  }
  .stage[data-scene="intro"] .flash{ animation:flashIn 1.4s ease-out forwards; }
  @keyframes flashIn{ 0%{opacity:.9;} 100%{opacity:0;} }

  /* ---- Persistent Hero AURA concentric rings (intro -> reveal -> retract) ---- */
  .aura-hero{
    position:absolute;
    left:50%;
    top:50%;
    width:320px;
    height:320px;
    transform:translate(-50%,-50%) scale(.05);
    opacity:0;
    pointer-events:none;
    z-index:2;
  }
  .stage[data-scene="intro"] .aura-hero{ animation:heroIntro 1.2s ease-out forwards; }
  .stage[data-scene="reveal"] .aura-hero{ animation:heroBloom 2.1s cubic-bezier(.16,.9,.3,1) forwards; }
  .stage[data-scene="retract"] .aura-hero{ animation:heroRetract 0.38s cubic-bezier(.4,0,.2,1) forwards; }

  @keyframes heroIntro{
    from{ opacity:0; transform:translate(-50%,-50%) scale(.03); }
    to{ opacity:.9; transform:translate(-50%,-50%) scale(.075); }
  }
  @keyframes heroBloom{
    0%{ opacity:.9; transform:translate(-50%,-50%) scale(.075); }
    65%{ opacity:1; transform:translate(-50%,-50%) scale(1.08); }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
  @keyframes heroRetract{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(0.04); }
  }

  .aura-hero-inner{
    width:100%;
    height:100%;
    position:relative;
    animation:heroPulse 5s ease-in-out infinite;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  @keyframes heroPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.035);}
  }

  .aura-hero circle{ transform-box:fill-box; transform-origin:center; }
  .r1,.r2,.r3,.r4{
    animation-name:ringBreathe;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
  }
  .r1{ animation-duration:3.2s; }
  .r2{ animation-duration:4.1s; animation-delay:.3s; }
  .r3{ animation-duration:3.6s; animation-delay:.6s; }
  .r4{ animation-duration:4.6s; animation-delay:.9s; }
  @keyframes ringBreathe{ 0%,100%{opacity:.22;} 50%{opacity:.75;} }

  /* Each ring blooms outward on its beat as hero grows into reveal */
  .stage[data-scene="reveal"] .r1{ animation-name:ringBreathe,ringBurst; animation-duration:3.2s,.85s; animation-timing-function:ease-in-out,cubic-bezier(.16,.9,.3,1); animation-iteration-count:infinite,1; animation-fill-mode:none,both; animation-delay:0s,0s; }
  .stage[data-scene="reveal"] .r2{ animation-name:ringBreathe,ringBurst; animation-duration:4.1s,.85s; animation-timing-function:ease-in-out,cubic-bezier(.16,.9,.3,1); animation-iteration-count:infinite,1; animation-fill-mode:none,both; animation-delay:.3s,.14s; }
  .stage[data-scene="reveal"] .r3{ animation-name:ringBreathe,ringBurst; animation-duration:3.6s,.85s; animation-timing-function:ease-in-out,cubic-bezier(.16,.9,.3,1); animation-iteration-count:infinite,1; animation-fill-mode:none,both; animation-delay:.6s,.28s; }
  .stage[data-scene="reveal"] .r4{ animation-name:ringBreathe,ringBurst; animation-duration:4.6s,.85s; animation-timing-function:ease-in-out,cubic-bezier(.16,.9,.3,1); animation-iteration-count:infinite,1; animation-fill-mode:none,both; animation-delay:.9s,.42s; }
  @keyframes ringBurst{ from{ transform:scale(.45); } to{ transform:scale(1); } }

  /* Center Official Color Logo inside crisp White bubble */
  .center-logo-bubble{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:86px;
    height:86px;
    border-radius:50%;
    background:#FFFFFF;
    box-shadow:0 8px 24px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.03);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:5;
    opacity:0;
  }
  .stage[data-scene="reveal"] .center-logo-bubble{
    animation:logoBubbleReveal 1.2s cubic-bezier(.16,.9,.3,1) 0.1s forwards;
  }
  @keyframes logoBubbleReveal{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.6); }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  }
  .center-logo-bubble img{
    width:68px;
    height:68px;
    object-fit:contain;
  }

  /* ---- Scenes ---- */
  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .85s ease, transform .85s ease;
    pointer-events:none;
  }
  .scene.intro{
    padding:0 16px;
  }
  .scene.reveal{
    position:absolute;
    inset:0;
  }

  .stage[data-scene="intro"] .scene.intro,
  .stage[data-scene="reveal"] .scene.reveal{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .stage[data-scene="retract"] .scene.reveal{
    opacity:0;
    transform:translateY(8px);
    transition:opacity .32s ease, transform .32s ease;
  }

  /* Darker, Pixel-Perfect Strict 2-Line Intro across ALL Devices */
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-weight:500;
    font-size:clamp(0.68rem, 3.1vw, 0.76rem);
    text-transform:uppercase;
    line-height:2.2;
    margin:0;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .eyebrow .line{
    display:block;
    white-space:nowrap;
    width:max-content;
    max-width:100%;
    opacity:0;
    letter-spacing:0.12em;
    transform:translateY(12px);
    will-change:transform, opacity;
    color:var(--ink-dark); /* Darker, crisp contrast */
  }
  .stage[data-scene="intro"] .line-1{
    animation:lineReveal 1.4s cubic-bezier(.16,1,.3,1) 0.3s forwards;
  }
  .stage[data-scene="intro"] .line-2{
    animation:lineReveal 1.4s cubic-bezier(.16,1,.3,1) 1.2s forwards;
  }
  @keyframes lineReveal{
    0%{ opacity:0; transform:translateY(12px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  /* Reveal Scene: Positioned completely above the ring without overlap */
  .meet-label{
    position:absolute;
    left:50%;
    top:calc(50% - 176px);
    transform:translateX(-50%) translateY(20px);
    font-family:'Outfit','Manrope',sans-serif;
    font-weight:600;
    font-size:0.80rem;
    letter-spacing:0.32em;
    text-transform:uppercase;
    margin:0;
    z-index:10;
    color:var(--ink-dark);
    opacity:0;
    will-change:transform, opacity;
  }
  .stage[data-scene="reveal"] .meet-label{
    animation:smoothRiseMeet 1.4s cubic-bezier(.16,1,.3,1) 0.2s forwards;
  }
  @keyframes smoothRiseMeet{
    0%{ opacity:0; transform:translateX(-50%) translateY(20px); }
    100%{ opacity:0.8; transform:translateX(-50%) translateY(0); }
  }

  /* Minimalistic Outfit Typography for AURA in Wine/Blood Red strictly BELOW the ring with zero overlap */
  .wordmark{
    position:absolute;
    left:50%;
    top:calc(50% + 162px);
    transform:translateX(-50%) translateY(24px);
    z-index:10;
    margin:0;
    font-family:'Outfit',sans-serif;
    font-weight:600; /* Minimalist, clean weight */
    font-size:clamp(2.2rem, 9.5vw, 2.9rem); /* Refined size */
    letter-spacing:0.12em; /* Spacious minimalist tracking */
    color:var(--blood); /* Wine / Deep Blood Red #A31621 */
    text-shadow:none;
    line-height:1;
    opacity:0;
    will-change:transform, opacity;
  }
  .stage[data-scene="reveal"] .wordmark{
    animation:smoothRiseAura 1.5s cubic-bezier(.16,1,.3,1) 0.35s forwards;
  }
  @keyframes smoothRiseAura{
    0%{ opacity:0; transform:translateX(-50%) translateY(24px); }
    100%{ opacity:1; transform:translateX(-50%) translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage" data-scene="">

  <div class="flash"></div>

  <!-- Persistent Hero Concentric Rings Mark -->
  <div class="aura-hero">
    <div class="aura-hero-inner">
      <svg viewBox="0 0 320 320" width="100%" height="100%">
        <defs>
          <linearGradient id="gradHero" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D62828"/>
            <stop offset="60%" stop-color="#A31621"/>
            <stop offset="100%" stop-color="#780A14"/>
          </linearGradient>
        </defs>
        <circle class="r4" cx="160" cy="160" r="150" fill="none" stroke="url(#gradHero)" stroke-width="1.3"/>
        <circle class="r3" cx="160" cy="160" r="112" fill="none" stroke="url(#gradHero)" stroke-width="1.5"/>
        <circle class="r2" cx="160" cy="160" r="78"  fill="none" stroke="url(#gradHero)" stroke-width="1.7"/>
        <circle class="r1" cx="160" cy="160" r="48"  fill="none" stroke="url(#gradHero)" stroke-width="1.9"/>
        <circle class="aura-core" cx="160" cy="160" r="6" fill="#A31621"/>
      </svg>
      <div class="center-logo-bubble">
        <img src="aura_logo_color.png" alt="AURA Logo">
      </div>
    </div>
  </div>

  <!-- Scene 1: Strict 2 Lines with Clean Visible First Letters & Darker Text -->
  <div class="scene intro">
    <p class="eyebrow">
      <span class="line line-1">YOU'RE STEPPING INTO</span>
      <span class="line line-2">THE NEXT LEVEL OF VOICE ASSISTANTS</span>
    </p>
  </div>

  <!-- Scene 2: Reveal (Meet above ring, Outfit AURA below ring with zero overlap) -->
  <div class="scene reveal">
    <p class="meet-label">Meet</p>
    <h1 class="wordmark">AURA</h1>
  </div>

</div>

<script>
  const stage = document.getElementById('stage');
  let timers = [];

  function playSequence(){
    timers.forEach(clearTimeout);
    timers = [];
    stage.setAttribute('data-scene', '');

    timers.push(setTimeout(() => stage.setAttribute('data-scene', 'intro'), 150));
    timers.push(setTimeout(() => {
      stage.setAttribute('data-scene', 'reveal');
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate([30, 40, 30]);
      }
    }, 4400));
  }

  // Callable externally from Android Kotlin WebView
  window.retractHero = function() {
    timers.forEach(clearTimeout);
    timers = [];
    stage.setAttribute('data-scene', 'retract');
  };

  window.addEventListener('load', playSequence);
  document.body.addEventListener('click', () => {
    if (stage.getAttribute('data-scene') !== 'reveal' && stage.getAttribute('data-scene') !== 'retract') {
      stage.setAttribute('data-scene', 'reveal');
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(30);
      }
    }
  });
</script>

</body>
</html>
